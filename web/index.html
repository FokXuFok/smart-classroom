<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 智课堂 SmartClassroom</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
         background: radial-gradient(1000px 500px at 85% -10%, rgba(30,58,138,.1), transparent),
                     radial-gradient(800px 400px at -10% 110%, rgba(245,158,11,.08), transparent), var(--bg); }
  .login-card { display: flex; width: 880px; max-width: 94vw; min-height: 520px;
                background: var(--white); border-radius: 16px; overflow: hidden;
                box-shadow: 0 20px 60px rgba(22,51,122,.16); }
  .login-brand { flex: 1.15; background: var(--blue-grad); color: #fff; padding: 44px 40px;
                 display: flex; flex-direction: column; }
  .brand-logo { width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.14);
                display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .brand-logo svg { width: 30px; height: 30px; }
  .login-brand h1 { font-size: 30px; letter-spacing: 2px; }
  .login-brand .en { font-size: 11px; letter-spacing: 4px; color: #9db4e8; margin: 4px 0 30px; }
  .brand-points { display: flex; flex-direction: column; gap: 18px; margin-top: auto; }
  .pt { display: flex; gap: 12px; align-items: flex-start; font-size: 12.5px; color: #c9d6f5; line-height: 1.55; }
  .pt b { color: #fff; display: block; font-size: 14px; margin-bottom: 2px; }
  .pt .ico { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.1);
             display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pt .ico svg { width: 18px; height: 18px; }
  .brand-copy { margin-top: 28px; font-size: 11px; color: #8ea3dd; }
  .login-form-side { flex: 1; padding: 44px 40px; display: flex; flex-direction: column; justify-content: center; }
  .login-form-side h2 { font-size: 22px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--text-sub); margin-bottom: 22px; }
  .sub a { color: var(--blue); text-decoration: none; font-weight: 600; cursor: pointer; }
  .sub a:hover { text-decoration: underline; }
  .form-item { margin-bottom: 16px; }
  .form-item label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
  .input, select.input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius);
           font-size: 14px; font-family: inherit; background: var(--white); color: var(--text);
           transition: border-color .15s, box-shadow .15s; box-sizing: border-box; }
  .input:focus, select.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30,58,138,.1); }
  .segment { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .segment button { padding: 9px 0; border: 1px solid var(--border); background: var(--white);
                    border-radius: var(--radius); font-size: 13px; cursor: pointer; font-family: inherit;
                    color: var(--text-sub); transition: all .15s; }
  .segment button.active { background: var(--blue-grad); color: #fff; border-color: transparent; font-weight: 600; }
  .form-error { display: flex; align-items: center; gap: 6px; color: var(--absent);
                font-size: 13px; min-height: 20px; margin-bottom: 6px; }
  .form-error svg { width: 16px; height: 16px; flex-shrink: 0; }
  .form-ok { display: flex; align-items: center; gap: 6px; color: var(--ok);
             font-size: 13px; min-height: 20px; margin-bottom: 6px; }
  .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4);
             border-top-color: #fff; border-radius: 50%; display: inline-block;
             animation: spin .7s linear infinite; }
  .mt-16 { margin-top: 16px; }
  .demo-accts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .demo-accts button { padding: 7px 0; border: 1px solid var(--border); background: var(--white);
                       border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit;
                       color: var(--text-sub); transition: all .15s; }
  .demo-accts button:hover { border-color: var(--blue); color: var(--blue); background: #eef2fb; }
  @media (max-width: 760px) { .login-brand { display: none; } }
</style>
</head>
<body>

<div class="login-card">
  <!-- 左：品牌区 -->
  <div class="login-brand">
    <div>
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9L12 4 2 9l10 5 10-5z"/><path d="M6 11.5V16c0 1.2 2.7 3 6 3s6-1.8 6-3v-4.5"/><path d="M22 9v5"/></svg>
      </div>
      <h1>智课堂</h1>
      <div class="en">SMART&nbsp;CLASSROOM</div>
    </div>
    <div class="brand-points">
      <div class="pt">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></span>
        <div><b>人脸 + 定位签到</b>双因子核验，200 米电子围栏，毫秒级完成课堂点名</div>
      </div>
      <div class="pt">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg></span>
        <div><b>在线编程作业</b>沙箱自动评测判分，AI 逐题反馈改进建议</div>
      </div>
      <div class="pt">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 4h6"/><circle cx="9" cy="13" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/><path d="M9.5 16.5h5"/></svg></span>
        <div><b>AI 课程助教</b>7×24 智能答疑，匿名提问畅所欲言</div>
      </div>
    </div>
    <div class="brand-copy">© 2026 全流程智慧课堂系统 · 大学生创新实践项目</div>
  </div>

  <!-- 右：登录 / 注册 -->
  <div class="login-form-side">

    <!-- 登录视图 -->
    <div id="login-view">
      <h2>欢迎回来</h2>
      <p class="sub">输入账号密码，系统自动识别身份</p>

      <div class="form-item">
        <label>账号</label>
        <input class="input" id="login-username" placeholder="学号 / 工号" autocomplete="username" maxlength="32">
      </div>
      <div class="form-item">
        <label>密码</label>
        <input class="input" id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password" maxlength="64">
      </div>

      <div class="form-error" id="login-err"></div>
      <button class="btn btn-primary btn-lg" id="login-btn">登 录</button>

      <p class="sub mt-16" style="margin-bottom:6px;text-align:center">
        没有账号？<a id="to-register">立即注册</a>
      </p>
      <p class="sub" style="margin-bottom:6px;text-align:center;font-size:12px">演示账号（点击自动填入）：</p>
      <div class="demo-accts" id="demo-accts">
        <button type="button" data-un="2024001">学生 2024001</button>
        <button type="button" data-un="T001">教师 T001</button>
        <button type="button" data-un="C001">辅导员 C001</button>
        <button type="button" data-un="admin">管理员 admin</button>
      </div>
    </div>

    <!-- 注册视图 -->
    <div id="register-view" style="display:none">
      <h2>注册账号</h2>
      <p class="sub">注册后需管理员审核通过方可登录</p>

      <div class="form-item">
        <label>姓名</label>
        <input class="input" id="reg-name" placeholder="真实姓名" maxlength="50">
      </div>
      <div class="form-item">
        <label>身份</label>
        <div class="segment" id="reg-role-seg">
          <button type="button" data-role="student" class="active">学生</button>
          <button type="button" data-role="teacher">教师</button>
        </div>
      </div>
      <div class="form-item" id="reg-class-item">
        <label>班级</label>
        <select class="input" id="reg-class"></select>
      </div>
      <div class="form-item">
        <label>账号</label>
        <input class="input" id="reg-username" placeholder="学号 / 工号" maxlength="20">
      </div>
      <div class="form-item">
        <label>密码</label>
        <input class="input" id="reg-password" type="password" placeholder="至少 6 位" maxlength="64">
      </div>
      <div class="form-item">
        <label>确认密码</label>
        <input class="input" id="reg-password2" type="password" placeholder="再次输入密码" maxlength="64">
      </div>

      <div class="form-error" id="reg-err"></div>
      <button class="btn btn-primary btn-lg" id="register-btn">注 册</button>

      <p class="sub mt-16" style="margin-bottom:0;text-align:center">
        已有账号？<a id="to-login">返回登录</a>
      </p>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 视图切换 ---------- */
  var loginView = $("login-view");
  var registerView = $("register-view");
  function showLogin() { loginView.style.display = ""; registerView.style.display = "none"; }
  function showRegister() { loginView.style.display = "none"; registerView.style.display = ""; }
  $("to-register").addEventListener("click", function () { clearErr("reg-err"); clearOk("login-ok"); showRegister(); });
  $("to-login").addEventListener("click", function () { clearErr("login-err"); showLogin(); });

  /* ---------- 提示 ---------- */
  function showErr(id, msg) {
    var el = $(id);
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span></span>';
    el.lastChild.textContent = msg;
  }
  function clearErr(id) { var el = $(id); el.textContent = ""; el.innerHTML = ""; }
  function clearOk(id) { var el = $(id); if (el) el.remove(); }

  /* ---------- 登录 ---------- */
  var loginBusy = false;
  async function doLogin() {
    if (loginBusy) return;
    var username = $("login-username").value.trim();
    var password = $("login-password").value;
    if (!username) return showErr("login-err", "请输入账号");
    if (!password) return showErr("login-err", "请输入密码");
    clearErr("login-err");
    loginBusy = true;
    var btn = $("login-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 登录中…';
    try {
      var data = await api.post("/api/auth/login",
        { username: username, password: password }, { silent: true });
      btn.innerHTML = "登录成功，正在跳转…";
      location.href = data.role + ".html";
    } catch (err) {
      showErr("login-err", err.message || "登录失败，请稍后重试");
      btn.disabled = false;
      btn.innerHTML = "登 录";
      loginBusy = false;
    }
  }
  $("login-btn").addEventListener("click", doLogin);
  $("login-password").addEventListener("keydown", function (e) { if (e.key === "Enter") doLogin(); });
  $("login-username").addEventListener("keydown", function (e) { if (e.key === "Enter") $("login-password").focus(); });

  /* 演示账号一键填充（密码统一 123456） */
  $("demo-accts").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-un]");
    if (!btn) return;
    $("login-username").value = btn.getAttribute("data-un");
    $("login-password").value = "123456";
    $("login-password").focus();
  });

  /* ---------- 注册 ---------- */
  var regRole = "student";
  $("reg-role-seg").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-role]");
    if (!btn) return;
    regRole = btn.getAttribute("data-role");
    $("reg-role-seg").querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b === btn); });
    // 学生显示班级，教师隐藏
    $("reg-class-item").style.display = regRole === "student" ? "" : "none";
  });

  // 加载班级列表
  api.get("/api/auth/class-options", { silent: true }).then(function (list) {
    var sel = $("reg-class");
    (list || []).forEach(function (c) {
      var o = document.createElement("option");
      o.value = c.class_code;
      o.textContent = c.class_name + "（" + c.class_code + "）";
      sel.appendChild(o);
    });
    if (!(list || []).length) {
      var o = document.createElement("option");
      o.value = "";
      o.textContent = "暂无班级，请联系管理员";
      sel.appendChild(o);
    }
  }).catch(function () { /* 忽略，注册时再校验 */ });

  var regBusy = false;
  async function doRegister() {
    if (regBusy) return;
    var name = $("reg-name").value.trim();
    var username = $("reg-username").value.trim();
    var password = $("reg-password").value;
    var password2 = $("reg-password2").value;
    var class_id = regRole === "student" ? $("reg-class").value : null;

    if (!name) return showErr("reg-err", "请输入姓名");
    if (!username) return showErr("reg-err", "请输入账号");
    if (password.length < 6) return showErr("reg-err", "密码至少 6 位");
    if (password !== password2) return showErr("reg-err", "两次输入的密码不一致");
    if (regRole === "student" && !class_id) return showErr("reg-err", "请选择班级");
    clearErr("reg-err");

    regBusy = true;
    var btn = $("register-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 提交中…';
    try {
      await api.post("/api/auth/register",
        { username: username, password: password, name: name, role: regRole, class_id: class_id },
        { silent: true });
      // 注册成功 → 切回登录视图，预填账号并提示等待审批
      $("login-username").value = username;
      $("login-password").value = "";
      showLogin();
      var okEl = document.createElement("div");
      okEl.className = "form-ok";
      okEl.id = "login-ok";
      okEl.textContent = "注册成功，请等待管理员审核通过后登录";
      loginView.insertBefore(okEl, $("login-err"));
    } catch (err) {
      showErr("reg-err", err.message || "注册失败，请稍后重试");
      btn.disabled = false;
      btn.innerHTML = "注 册";
      regBusy = false;
    }
  }
  $("register-btn").addEventListener("click", doRegister);
  $("reg-password2").addEventListener("keydown", function (e) { if (e.key === "Enter") doRegister(); });
})();
</script>
</body>
</html>
